<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - WOODPLACE</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>

    <div data-include="header.html"></div>

    <main class="auth-wrapper">

        <div class="auth-container">
            <h2 class="auth-title">Join Us</h2>
            
            <form action="#" method="POST" id="joinForm">
                <div class="input-group">
                    <label for="joinEmail" class="input-label">이메일 주소 (아이디) *</label>
                    <input type="email" id="joinEmail" class="input-text" required placeholder="example@woodplace.com">
                </div>
                
                <div class="input-group">
                    <label for="joinPw" class="input-label">비밀번호 *</label>
                    <input type="password" id="joinPw" class="input-text" required placeholder="영문, 숫자 포함 8자 이상">
                </div>

                <div class="input-group">
                    <label for="joinPwConfirm" class="input-label">비밀번호 확인 *</label>
                    <input type="password" id="joinPwConfirm" class="input-text" required placeholder="비밀번호를 한번 더 입력해 주세요">
                </div>

                <div class="input-group">
                    <label for="joinName" class="input-label">이름 *</label>
                    <input type="text" id="joinName" class="input-text" required placeholder="이름을 입력해 주세요">
                </div>

                <div class="input-group">
                    <label for="joinPhone" class="input-label">휴대폰 번호 *</label>
                    <input type="tel" id="joinPhone" class="input-text" required placeholder="010-0000-0000">
                </div>

                <div class="input-group join-agree-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="agreeTerm" required>
                        <span><strong>[필수]</strong> 이용약관 및 개인정보 처리방침 동의</span>
                    </label>
                    <div class="form-policy-box">
                        우드플레이스 쇼핑몰 서비스 이용을 위해 상기 약관에 동의합니다. 본 약관은 서비스 이용자가 당사에서 제공하는 가구 및 인테리어 소품 쇼핑몰 서비스를 이용함에 있어 회사와 이용자의 권리, 의무 및 책임사항을 규정함을 목적으로 합니다...
                    </div>
                </div>

                <button type="submit" class="btn btn-accent join-submit-btn">가입 완료하기</button>
            </form>
        </div>
    </main>

    <div data-include="footer.html"></div>

    <script src="js/common.js"></script>
</body>
</html>
