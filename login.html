<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - WOODPLACE</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>

    <div data-include="header.html"></div>

    <main class="auth-wrapper">

        <div class="auth-container">
            <h2 class="auth-title">Login</h2>
            
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="loginId" class="input-label">아이디 (이메일)</label>
                    <input type="email" id="loginId" class="input-text" required placeholder="example@woodplace.com">
                </div>
                
                <div class="input-group">
                    <label for="loginPw" class="input-label">비밀번호</label>
                    <input type="password" id="loginPw" class="input-text" required placeholder="비밀번호를 입력해주세요">
                </div>

                <div class="auth-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="saveId">
                        <span>아이디 저장</span>
                    </label>
                    <div class="auth-links">
                        <a href="#">아이디 찾기</a>
                        <span>|</span>
                        <a href="#">비밀번호 찾기</a>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">로그인</button>
            </form>

            <div class="auth-divider">또는</div>
            
            <a href="join.html" class="btn btn-outline">회원가입하기</a>
        </div>
    </main>

    <div data-include="footer.html"></div>

    <script src="js/common.js"></script>
</body>
</html>
